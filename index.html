<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>建築確認 調べ先リンク集</title>
<style>
:root {
  --bg:#F2F5F7; --panel:#FFFFFF; --ink:#0F2530; --sub:#5A6B73; --faint:#8A989F; --line:#DDE4E8;
  --a:#17708F; --a2:#0E4F66; --a-ink:#FFFFFF; --a-pale:#E3F0F5; --glow:rgba(23,112,143,.20);
  --ok:#2C7A51; --ok-pale:#E5F3EB; --warn:#9A6412; --warn-pale:#FFF4DE;
  --memo:#FFF8D6; --memo-line:#E9D58A; --memo-ink:#5B4A12;
  --c1:#17708F; --c2:#7A5AA8; --c3:#4D7C2A; --c4:#B5502E; --c5:#8C6A1C; --c6:#5B6770; --c7:#2D6C9E; --c8:#6B7280;
  --shadow:0 1px 2px rgba(15,37,48,.05), 0 8px 24px rgba(15,37,48,.06);
  --r:16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0D171C; --panel:#152329; --ink:#E5EDF0; --sub:#9EB0B8; --faint:#73868E; --line:#25353D;
  --a:#5CB6D6; --a2:#3E93B3; --a-ink:#06141A; --a-pale:#17313B; --glow:rgba(92,182,214,.25);
  --ok:#6CC18F; --ok-pale:#163024; --warn:#E6B66A; --warn-pale:#382C16;
  --memo:#2F2A16; --memo-line:#5E5124; --memo-ink:#EBDDA4;
  --c1:#5CB6D6; --c2:#B79BE0; --c3:#9BC873; --c4:#EE9373; --c5:#E0C06A; --c6:#A3B0B8; --c7:#7FB3E0; --c8:#A3A9B3;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.22); } }
:root[data-theme="dark"] {
  --bg:#0D171C; --panel:#152329; --ink:#E5EDF0; --sub:#9EB0B8; --faint:#73868E; --line:#25353D;
  --a:#5CB6D6; --a2:#3E93B3; --a-ink:#06141A; --a-pale:#17313B; --glow:rgba(92,182,214,.25);
  --ok:#6CC18F; --ok-pale:#163024; --warn:#E6B66A; --warn-pale:#382C16;
  --memo:#2F2A16; --memo-line:#5E5124; --memo-ink:#EBDDA4;
  --c1:#5CB6D6; --c2:#B79BE0; --c3:#9BC873; --c4:#EE9373; --c5:#E0C06A; --c6:#A3B0B8; --c7:#7FB3E0; --c8:#A3A9B3;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.22); }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; scroll-padding-top:120px; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Yu Gothic UI","Yu Gothic","Hiragino Sans","Meiryo",sans-serif; font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased; }
a { color:inherit; }
button, input, textarea { font-family:inherit; color:inherit; }
:focus-visible { outline:3px solid var(--glow); outline-offset:2px; border-radius:8px; }
main:focus, main:focus-visible { outline:none; }
.duo > *, .row > *, .lkline > *, .ttl > * { min-width:0; }
.what, .who, .cmemo, .hit, .note { overflow-wrap:anywhere; }
.wrap { max-width:1020px; margin:0 auto; padding:0 16px; }
.ic-s { display:inline-block; vertical-align:-3px; }

/* 上の帯 */
header { background:color-mix(in srgb, var(--panel) 90%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
header .wrap { display:flex; align-items:center; gap:12px; padding-top:10px; padding-bottom:10px; }
.brand { display:flex; align-items:center; gap:10px; cursor:pointer; white-space:nowrap; border:0; background:none; padding:2px; text-align:left; }
.brand .mk { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg, #1A7FA2, #0E4F66); display:grid; place-items:center; color:#fff; box-shadow:0 3px 10px rgba(14,79,102,.3); }
.brand b { font-size:17px; letter-spacing:.03em; display:block; line-height:1.25; }
.brand small { display:block; font-size:11px; color:var(--sub); }
.sbox { position:relative; flex:1; }
.sbox > svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--faint); pointer-events:none; }
#q { width:100%; padding:11px 44px 11px 42px; border:1.5px solid var(--line); border-radius:12px; font-size:16.5px; background:var(--panel); transition:border-color .15s, box-shadow .15s; }
#q::placeholder { color:var(--faint); }
#q:focus { outline:none; border-color:var(--a); box-shadow:0 0 0 4px var(--glow); }
.kbd { position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--faint); border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:0 7px; pointer-events:none; background:var(--bg); }
#sug { position:absolute; left:0; right:0; top:calc(100% + 6px); background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.16); display:none; max-height:64vh; overflow-y:auto; padding:6px; }
#sug button { display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; text-align:left; border:0; background:none; padding:9px 12px; font-size:16px; cursor:pointer; border-radius:9px; }
#sug button.on { background:var(--a-pale); }
#sug button mark { background:none; color:var(--a); font-weight:bold; }
#sug small { color:var(--sub); font-size:13px; white-space:nowrap; }
#sug .tk { font-size:11px; color:var(--a); border:1px solid currentColor; border-radius:4px; padding:0 4px; margin-left:6px; }
#sug .wd { border-top:1px solid var(--line); border-radius:0 0 9px 9px; margin-top:4px; padding-top:11px; color:var(--a); }
.hbtn { position:relative; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:9px 12px; font-size:14.5px; cursor:pointer; white-space:nowrap; transition:all .12s; }
.hbtn:hover { border-color:var(--a); color:var(--a); }
.hbtn .cnt { min-width:20px; height:20px; border-radius:10px; background:var(--memo-line); color:var(--memo-ink); font-size:12px; font-weight:bold; display:inline-grid; place-items:center; padding:0 5px; }
.hbtn.sq { padding:9px; }
main { padding:22px 0 36px; min-height:62vh; }
.fade { animation:fade .24s ease-out; }
@keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation:none; } html { scroll-behavior:auto; } * { transition:none !important; } }

/* はじめの画面 */
.hero { position:relative; overflow:hidden; border-radius:20px; padding:28px 28px 24px; margin-bottom:16px; color:#fff;
  background:radial-gradient(900px 260px at 95% -30%, rgba(255,255,255,.20), transparent 60%), radial-gradient(500px 200px at 0% 120%, rgba(92,182,214,.35), transparent 60%), linear-gradient(135deg, #1A7FA2 0%, #0E4F66 58%, #0A3A4B 100%); box-shadow:0 10px 30px rgba(14,79,102,.25); }
.hero h2 { font-size:30px; margin:0 0 6px; letter-spacing:.03em; line-height:1.3; }
.hero p { margin:0; opacity:.92; font-size:15.5px; max-width:640px; }
.hero .stats { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
.hero .stats div { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); border-radius:12px; padding:6px 14px; }
.hero .stats b { font-size:22px; margin-right:4px; font-variant-numeric:tabular-nums; }
.hero .stats span { font-size:13px; opacity:.9; }
.hero .deco { position:absolute; right:-6px; bottom:-14px; opacity:.14; pointer-events:none; }
.band { display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:11px 14px; margin:0 0 16px; box-shadow:var(--shadow); }
.dot { width:32px; height:32px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--ok-pale); color:var(--ok); }
.band.warn .dot { background:var(--warn-pale); color:var(--warn); }
.band .tx { flex:1; font-size:15px; line-height:1.5; }
.band .tx small { display:block; color:var(--sub); font-size:12.5px; }
.pill { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:5px 14px; font-size:14.5px; cursor:pointer; transition:all .12s; white-space:nowrap; }
.pill:hover { border-color:var(--a); color:var(--a); }
.pill.memo { background:var(--memo); border-color:var(--memo-line); color:var(--memo-ink); }
.shelf { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 14px; }
.shelf > span { color:var(--sub); font-size:13.5px; margin-right:4px; display:inline-flex; align-items:center; gap:5px; }
.pref { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:15px 16px 16px; margin-bottom:14px; box-shadow:var(--shadow); }
.pref h3 { margin:0 0 11px; font-size:18px; display:flex; align-items:center; gap:10px; }
.pref h3 .n { font-size:13px; color:var(--sub); font-weight:normal; flex:1; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(114px, 1fr)); gap:7px; }
.grid button { position:relative; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:8px 6px; font-size:15px; cursor:pointer; transition:all .12s; }
.grid button:hover { border-color:var(--a); background:var(--a-pale); color:var(--a); transform:translateY(-1px); box-shadow:0 4px 10px var(--glow); }
.grid button.tk { font-weight:bold; }
.grid button .d { position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--a); }
.grid button .mm { position:absolute; top:4px; left:5px; color:var(--memo-line); }
.legend { font-size:13px; color:var(--sub); margin:2px 4px 0; display:flex; flex-wrap:wrap; align-items:center; gap:4px 16px; }
.legend i { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--a); margin-right:5px; }

/* 市町村の画面 */
.crumbs { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--sub); margin-bottom:6px; }
.crumbs button { border:0; background:none; color:var(--a); cursor:pointer; padding:2px 0; font-size:14px; }
.crumbs button:hover { text-decoration:underline; }
.ttl { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-bottom:12px; }
.ttl h2 { font-size:32px; margin:0; letter-spacing:.03em; line-height:1.2; }
.ttl .sp { flex:1; }
.badge { display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:bold; color:var(--a); background:var(--a-pale); border-radius:999px; padding:3px 11px; }
.duo { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
.who { display:flex; gap:12px; align-items:flex-start; background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--a); border-radius:14px; padding:12px 14px; font-size:15px; box-shadow:var(--shadow); }
.who svg { flex:none; color:var(--a); margin-top:2px; }
.who b { color:var(--a); }
.cmemo { background:var(--memo); border:1px solid var(--memo-line); border-radius:14px; padding:10px 12px; color:var(--memo-ink); box-shadow:var(--shadow); }
.cmemo .h { display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:bold; margin-bottom:4px; }
.cmemo .h .st { margin-left:auto; font-weight:normal; font-size:12px; opacity:.8; }
.cmemo textarea { width:100%; min-height:52px; border:0; background:transparent; resize:vertical; font-size:15px; line-height:1.6; color:var(--memo-ink); padding:0; }
.cmemo textarea:focus { outline:none; }
.cmemo textarea::placeholder { color:var(--memo-ink); opacity:.55; }
.toc { position:sticky; top:63px; z-index:6; display:flex; gap:6px; overflow-x:auto; padding:8px 0 10px; margin:0 0 4px; background:linear-gradient(var(--bg) 75%, transparent); scrollbar-width:none; }
.toc::-webkit-scrollbar { display:none; }
.toc a { flex:none; text-decoration:none; font-size:13.5px; border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:4px 12px 4px 9px; display:inline-flex; align-items:center; gap:6px; transition:all .12s; }
.toc a:hover { border-color:var(--pc); color:var(--pc); }
.toc a i { width:8px; height:8px; border-radius:50%; background:var(--pc); }
.toc a.off { opacity:.45; }
.row { --pc:var(--c1); background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:15px 16px; margin-bottom:12px; display:grid; grid-template-columns:46px 180px 1fr; gap:4px 14px; align-items:start; box-shadow:var(--shadow); transition:box-shadow .2s; }
.row:target, .row.flash { box-shadow:0 0 0 3px color-mix(in srgb, var(--pc) 35%, transparent), var(--shadow); }
.row .ic { width:46px; height:46px; border-radius:13px; display:grid; place-items:center; color:var(--pc); background:color-mix(in srgb, var(--pc) 13%, transparent); }
.row .k b { display:block; font-size:17.5px; line-height:1.35; margin-top:2px; }
.row .k small { color:var(--sub); font-size:12.5px; line-height:1.5; display:block; margin-top:3px; }
.lk { margin-bottom:2px; }
.lk + .lk { margin-top:10px; }
.lkline { display:flex; gap:8px; align-items:stretch; }
.go { flex:1; display:flex; align-items:center; gap:12px; text-decoration:none; background:linear-gradient(135deg, var(--a), var(--a2)); color:var(--a-ink); border-radius:12px; padding:11px 16px; font-weight:bold; font-size:16px; transition:transform .12s, box-shadow .12s; box-shadow:0 2px 8px var(--glow); min-width:0; }
.go:hover { transform:translateY(-1px); box-shadow:0 8px 20px var(--glow); }
.go .lbl { flex:1; min-width:0; }
.go svg { flex:none; opacity:.9; }
.go.sub { background:var(--panel); color:var(--a); border:1px solid var(--line); box-shadow:none; font-size:15px; padding:9px 14px; }
.go.sub:hover { border-color:var(--a); background:var(--a-pale); box-shadow:none; }
.act { flex:none; display:grid; place-items:center; width:42px; border:1px solid var(--line); background:var(--panel); border-radius:12px; cursor:pointer; color:var(--sub); transition:all .12s; }
.act:hover { border-color:var(--a); color:var(--a); }
.act.has { background:var(--memo); border-color:var(--memo-line); color:var(--memo-ink); }
.tagk { display:inline-block; font-size:11.5px; font-weight:bold; background:rgba(255,255,255,.22); border-radius:4px; padding:0 6px; margin-right:8px; vertical-align:1px; }
.go.sub .tagk { background:var(--a-pale); color:var(--a); }
.what { font-size:14px; color:var(--sub); margin:6px 2px 0; }
.note { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--warn); background:var(--warn-pale); border-radius:7px; padding:2px 9px; margin:6px 4px 0 2px; }
.lmemo { margin:8px 0 0; background:var(--memo); border:1px solid var(--memo-line); border-radius:10px; padding:7px 10px; color:var(--memo-ink); }
.lmemo textarea { width:100%; min-height:42px; border:0; background:transparent; resize:vertical; font-size:14.5px; line-height:1.55; color:var(--memo-ink); padding:0; }
.lmemo textarea:focus { outline:none; }
.lmemo textarea::placeholder { color:var(--memo-ink); opacity:.55; }
.lmemo .st { font-size:11.5px; opacity:.75; text-align:right; }
details.more { margin-top:10px; }
details.more summary { cursor:pointer; color:var(--a); font-size:14px; list-style:none; display:inline-flex; align-items:center; gap:5px; padding:2px 0; }
details.more summary::-webkit-details-marker { display:none; }
details.more summary::before { content:""; width:7px; height:7px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(-45deg); transition:transform .15s; margin-right:3px; }
details.more[open] summary::before { transform:rotate(45deg); }
details.more > div { margin-top:8px; padding-left:10px; border-left:2px solid var(--line); }
.none { color:var(--sub); font-size:14.5px; padding-top:11px; }
.row.empty { box-shadow:none; background:transparent; border-style:dashed; }
.row.empty .ic { filter:grayscale(1); opacity:.55; }
.row.empty .k b { color:var(--sub); }

/* 一覧の画面（検索・見回り・メモ） */
.hits h2 { font-size:24px; margin:0 0 4px; }
.hits .lead { color:var(--sub); margin:0 0 16px; font-size:14.5px; }
.hit { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:11px 14px; margin-bottom:8px; box-shadow:var(--shadow); }
.hit .w2 { font-size:13px; color:var(--sub); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.hit .w2 button { border:0; background:none; color:var(--a); cursor:pointer; padding:0; font-size:13px; }
.hit .w2 button:hover { text-decoration:underline; }
.hit a.t { color:var(--a); font-weight:bold; text-decoration:none; }
.hit a.t:hover { text-decoration:underline; }
.hit .url { font-size:12px; color:var(--faint); word-break:break-all; }
.hit .mtx { background:var(--memo); border:1px solid var(--memo-line); color:var(--memo-ink); border-radius:9px; padding:6px 10px; margin-top:6px; white-space:pre-wrap; font-size:14.5px; }
.grp { margin-bottom:20px; }
.grp h3 { font-size:16px; margin:0 0 9px; display:flex; align-items:center; gap:8px; }
.grp h3 span { font-size:13px; background:var(--a-pale); color:var(--a); border-radius:999px; padding:0 9px; }
.grp .nil { color:var(--sub); font-size:14px; padding:4px 2px; }
.tools { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; }
.empty-state { text-align:center; color:var(--sub); padding:40px 16px; background:var(--panel); border:1px dashed var(--line); border-radius:var(--r); }
.empty-state svg { color:var(--memo-line); margin-bottom:6px; }
.gate { text-align:center; max-width:560px; margin:60px auto; background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:36px 24px; box-shadow:var(--shadow); }
.gate .gi { width:66px; height:66px; margin:0 auto 12px; border-radius:50%; display:grid; place-items:center; background:var(--a-pale); color:var(--a); }
.gate h2 { margin:0 0 8px; font-size:22px; }
.gate p { margin:0; color:var(--sub); }
footer { font-size:13px; color:var(--sub); padding:0 0 34px; line-height:1.75; }
footer .wrap { border-top:1px solid var(--line); padding-top:14px; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); border-radius:999px; padding:9px 20px; font-size:14px; opacity:0; transition:all .2s; pointer-events:none; z-index:30; box-shadow:0 8px 24px rgba(0,0,0,.2); }
.toast.on { opacity:1; transform:translateX(-50%); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
@media (max-width: 760px) {
  header .wrap { flex-wrap:wrap; }
  .brand small, .kbd, .hbtn .lb { display:none; }
  .sbox { order:3; flex-basis:100%; }
  .brand { flex:1; }
  .duo { grid-template-columns:1fr; }
  .row { grid-template-columns:40px 1fr; padding:13px; }
  .row .ic { width:40px; height:40px; }
  .row > .body { grid-column:1 / -1; }
  .toc { top:108px; }
  .hero { padding:22px 20px; } .hero h2 { font-size:24px; }
  .ttl h2 { font-size:26px; }
  .ttl .sp { display:none; }
  .ttl .pill { font-size:13.5px; padding:4px 11px; }
  .cmemo .h { flex-wrap:wrap; } .cmemo .h .st { margin-left:0; width:100%; }
  .hbtn { padding:8px 10px; }
  .act { width:38px; }
}
@media print {
  header, .crumbs, .toc, .band, .act, .ttl .pill, details.more summary, .toast, .cmemo textarea:placeholder-shown { display:none !important; }
  body { background:#fff; } main { padding:0; }
  .row, .who, .cmemo { box-shadow:none; break-inside:avoid; }
  details.more > div { display:block !important; }
  .go { background:none !important; color:#000 !important; border:1px solid #bbb; box-shadow:none !important; }
  .go::after { content:"  " attr(href); font-weight:normal; font-size:10px; word-break:break-all; }
}

/* 2026-10-16 見やすく：重いボタンをやめ、1目的＝1枚の、静かなカードに */
.row { grid-template-columns:1fr; gap:0; padding:0; overflow:hidden; }
.row .rh { display:flex; align-items:center; gap:10px; padding:11px 16px 9px; border-bottom:1px solid var(--line); }
.row .rh .ic { width:30px; height:30px; border-radius:8px; }
.row .rh .ic svg { width:17px; height:17px; }
.row .rh b { font-size:16.5px; }
.row .body { padding:6px 8px 8px; }
.lk { display:flex; align-items:flex-start; gap:6px; border-radius:10px; padding:8px 8px; margin:0 !important; }
.lk:hover { background:var(--a-pale); }
.lk .main { flex:1; min-width:0; text-decoration:none; display:block; }
.lk .main .tl { color:var(--a); font-weight:bold; font-size:16px; line-height:1.45; }
.lk .main .tl svg { vertical-align:-2px; margin-left:4px; opacity:.7; }
.lk .main .what { margin:2px 0 0; font-size:13.5px; }

:root { --c1:#1E6FB8; --c7:#4B4FB0; --c3:#18806E; --c4:#C2412D; --c9:#3E8A3A; --c5:#94621A; --c6:#68757D; --c2:#8A4FB0; --c8:#6B7280; --done:#2C8A57; --done-pale:#E4F5EA; }

/* 見回り */
function issues() {
  const out = [];
  D.prefs.forEach(p => [[p.name + "（県のページ）", p.pref], ...Object.entries(p.munis)].forEach(([m, xs]) => xs.forEach(x => {
    const st = ST[x.url]; if (!st) return;
    const pb = problem(st), ch = recentChg(st.changed), once = (st.fails || 0) === 1;
    if (pb || ch || once) out.push({ p, m, x, st, pb, ch, once });

    <div class="tx">${bad ? `開けないリンク <b>${n}</b> 件・題名が変わったページ <b>${c}</b> 件があります` : `${NLINK} 件のリンクは、すべて開けました`}<small>毎日 19 時に、すべてのリンクを見回っています（前回 ${esc(ST_AT)}）</small></div>

  document.addEventListener("keydown", e => { if (e.key === "Escape") $("#zoom").style.display = "none"; });
  document.addEventListener("submit", e => {
    if (e.target.id !== "startF") return;
    e.preventDefault();
    const v = $("#startA").value.trim(); if (!v) { $("#startA").focus(); return; }
    const o = findMuni(v);
    if (!o) { $("#startMsg").innerHTML = `<span class="msg">市町村の名前が見つかりませんでした。市町村の名前から貼り付けるか、下から選んでください。</span>`; CASE.addr = v; caseSave(); return; }
    CASE = { addr: v, where: D.prefs[o.p].name + "/" + o.m, items: {} }; caseSave();
    city(o.p, o.m);
  });
  let tm;
  document.addEventListener("input", e => {          // メモは、書くと自動で保存する
    const ta = e.target.closest("textarea[data-mk]"); if (!ta) return;
    clearTimeout(tm);
    tm = setTimeout(() => {
      const ok = memoSet(ta.dataset.mk, ta.value, ta.dataset.where || "");
      const st = ta.dataset.mk.startsWith("m:") ? $("#cmSt") : ta.parentElement.querySelector(".st");
      if (st) st.textContent = ok ? (ta.value.trim() ? "保存しました" : "メモを消しました") : "保存できませんでした";
      const act = ta.closest(".lkw") && ta.closest(".lkw").querySelector("[data-lmemo]"); if (act) act.classList.toggle("has", !!ta.value.trim());
    }, 500);
  });
  $("#home").onclick = () => { $("#q").value = ""; home(); };
  $("#memoBtn").onclick = () => memos();
  $("#memoIc").innerHTML = svg(I.memo, 18);
  $("#themeBtn").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); const n = cur === "dark" ? "light" : "dark"; store.set("linkshu-theme", n); theme(n); };
  theme(store.get("linkshu-theme", ""));
  memoCount();
}

/* 利用の制限（試用の期間・時間帯）。時刻は日本時間 */
function gate(c) {
  if (!c) return "";
  const now = new Date(Date.now() + (9 * 60 + new Date().getTimezoneOffset()) * 60e3);
  const z = n => String(n).padStart(2, "0");
  const ymd = `${now.getFullYear()}-${z(now.getMonth() + 1)}-${z(now.getDate())}`, hm = `${z(now.getHours())}:${z(now.getMinutes())}`, dw = now.getDay();
  const dn = "日月火水木金土", jd = s => s ? s.replace(/^(\d+)-0?(\d+)-0?(\d+)$/, "$1年$2月$3日") : "";
  const span = `${jd(c.trial_from)}〜${jd(c.trial_until)}`;
  const days = c.days || [], wk = days.join() === "1,2,3,4,5" ? "平日" : days.map(d => dn[d]).join("・");
  const hrs = `${wk} ${c.hours_from}〜${c.hours_to}`;
  if (c.trial_from && ymd < c.trial_from) return ["試用は、まだ始まっていません", `試用の期間は ${span} です。`];
  if (c.trial_until && ymd > c.trial_until) return ["試用の期間が終わりました", `試用の期間は ${span} でした。続けてお使いになるときは、${c.contact || "マルホープ"}までご連絡ください。`];
  if (days.length && !days.includes(dw) || c.hours_from && hm < c.hours_from || c.hours_to && hm >= c.hours_to)
    return ["いまは、ご利用の時間外です", `ご利用いただける時間は ${hrs} です（試用の期間 ${span}）。`];
  return "";
}
function boot() {
  wire();
  const c = D.config, g = /[?&]naiken\b/.test(location.search) ? "" : gate(c);   // ?naiken＝マルホープの確かめ用（制限の外でも見られる）
  if (g) {
    $("#main").innerHTML = `<div class="gate"><div class="gi">${svg(I.clock, 34)}</div><h2>${esc(g[0])}</h2><p>${esc(g[1])}</p></div>`;
    $("header .sbox").style.visibility = "hidden"; $("#memoBtn").style.display = "none";
    return;
  }
  const jd = s => s ? s.replace(/^(\d+)-0?(\d+)-0?(\d+)$/, "$1年$2月$3日") : "";
  $("#foot").innerHTML = `県・市町村の公式サイトだけ（${esc(D.built)} 版・毎日 19 時にリンクを見回り）。判断に迷うときは担当の課へ。`
    + (c && c.trial_until ? `　試用：${esc(jd(c.trial_until))}まで` : "")
    + `<br>リンクが開けない・載せてほしいページは、${esc((c && c.contact) || "株式会社マルホープ 岩崎")}まで。`;
  const h = decodeURIComponent(location.hash.slice(1));   // #山梨県/甲府市 の形で開くと、その市町村を出す
  if (h === "見回り") { report(); return; }
  if (h === "メモ") { memos(); return; }
  const [pn, m] = h.split("/");
  const i = D.prefs.findIndex(p => p.name === pn);
  if (i >= 0) city(i, m && D.prefs[i].munis[m] ? m : null); else home();
}
(() => {   // 最新の一覧を取りに行く。4秒で取れなければ、中に入っている一覧で動く
  setData(D);
  let done = false;
  const start = () => { if (done) return; done = true; if (window.LINK_LATEST && window.LINK_LATEST.built >= D.built) setData(window.LINK_LATEST); boot(); };
  if (!SITE || /^\?preview/.test(location.search)) { start(); return; }
  const s = document.createElement("script");
  s.src = SITE + "latest.js?t=" + Date.now();
  s.onload = start; s.onerror = start; setTimeout(start, 4000);
  document.head.appendChild(s);
})();
</script>
